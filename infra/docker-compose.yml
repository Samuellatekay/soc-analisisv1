# Stack development/single-node (BUKAN HA). Jalankan dari root repo:
#   cp .env.example .env && docker compose -f infra/docker-compose.yml --env-file .env up --build
# Profil produksi multi-node memerlukan orchestrator, replika/failover, TLS, secret manager (lihat README).
x-py: &py
  build: { context: .., dockerfile: infra/docker/python.Dockerfile }
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://soc:${POSTGRES_PASSWORD:-change-me-dev}@postgres:5432/soc
    REDIS_URL: redis://redis:6379/0
    ELASTICSEARCH_URL: http://elasticsearch:9200
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-dev}
    INGEST_MODE: queue
    EMBEDDED_WORKERS: "false"
  depends_on: [postgres, redis]
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: soc, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-dev}", POSTGRES_DB: soc }
    volumes: [pgdata:/var/lib/postgresql/data, ../migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # AOF: antrean tahan restart
    volumes: [redisdata:/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms1g -Xmx1g" }
    volumes: [esdata:/usr/share/elasticsearch/data]
  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change-me-dev}" }
    volumes: [neo4jdata:/data]
  api:
    <<: *py
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/api
    depends_on: [postgres, redis, elasticsearch]
    volumes: [../infra/config/connectors.json:/app/infra/config/connectors.json:ro]
  engine:
    <<: *py
    command: python -m services.engine.main
  rag_worker:
    <<: *py
    command: python -m services.rag_worker.main
  indexer:
    <<: *py
    command: python -m services.indexer.main
    depends_on: [postgres, elasticsearch]
  connectors:
    <<: *py
    command: python -m services.engine.adapters.runner
    volumes: [../infra/config/connectors.json:/app/infra/config/connectors.json:ro]
    # secret vendor: tambahkan env (SPLUNK_TOKEN, CS_CLIENT_SECRET, ...) atau Docker secret NAMA_FILE
  kb_sync:
    <<: *py
    command: python -m services.kb_sync.main
  backup:
    <<: *py
    command: python -m services.backup.main
    volumes: [backups:/backups]
  # master: control plane OPSIONAL & biasanya di lokasi terpisah dari cluster (lihat docs/MASTER.md). Contoh:
  master:
    build: { context: .., dockerfile: infra/docker/python.Dockerfile }
    profiles: ["master"]
    env_file: ../.env
    group_add: ["1998"]
    command: uvicorn app.main:app --app-dir apps/master --host 0.0.0.0 --port 8100
    environment:
      MASTER_DATABASE_URL: ${MASTER_DATABASE_URL:-sqlite:////app/data/master.db}
      MASTER_API_TOKENS: ${MASTER_API_TOKENS:-}
      MASTER_SIGNING_KEY_FILE: /run/secrets/master_policy.key
      MASTER_CONFIG_ENCRYPTION_KEY_FILE: /run/secrets/master_config.key
    volumes:
      - masterdata:/app/data
      - ../secrets/master/master_policy.key:/run/secrets/master_policy.key:ro
      - ../secrets/master/master_config.key:/run/secrets/master_config.key:ro
  master-web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    profiles: ["master"]
    ports: ["8081:8080", "8443:8443"]
    group_add: ["1999"]
    volumes:
      - ./docker/master-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../secrets/master/tls/master.crt:/run/tls/master.crt:ro
      - ../secrets/master/tls/master.key:/run/tls/master.key:ro
    depends_on: [master]
  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]
  # ollama: tambahkan service sendiri + pin tag model (OLLAMA_URL, OLLAMA_MODEL); tanpa ini analisis memakai template tanpa LLM.
volumes: { pgdata: {}, redisdata: {}, esdata: {}, neo4jdata: {}, backups: {}, masterdata: {} }
