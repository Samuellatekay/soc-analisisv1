apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: soc-cluster-01
resources:
  - ../../base
  - policy-agent.yaml
images:
  - name: soc-analisis-api
    newName: 192.168.33.140:5000/soc/soc-analisis-api
    newTag: v1.0.0
  - name: soc-analisis-web
    newName: 192.168.33.140:5000/soc/soc-analisis-web
    newTag: v1.0.0
patches:
  - path: namespace-patch.yaml
    target:
      group: ""
      version: v1
      kind: Namespace
      name: soc-analisis
  - path: config-patch.yaml
    target:
      group: ""
      version: v1
      kind: ConfigMap
      name: soc-config
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: soc
  - path: connectors-config-patch.yaml
    target:
      group: ""
      version: v1
      kind: ConfigMap
      name: soc-connectors-config
  - path: configuration-agent-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: configuration-agent
  - path: lab-capacity-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(api|engine|rag-worker|indexer|connectors|kb-sync|web|policy-agent|configuration-agent)$"
