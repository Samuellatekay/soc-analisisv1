apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-policy-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-policy-agent
        app.kubernetes.io/part-of: soc-analisis
    spec:
      serviceAccountName: soc
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-agent
          image: soc-analisis-api:release
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.engine.policy_agent"]
          envFrom:
            - configMapRef:
                name: soc-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: DATABASE_URL
            - name: MASTER_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: MASTER_CLUSTER_TOKEN
            - name: MASTER_POLICY_PUBKEY_FILE
              value: /run/secrets/master_policy.pub
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: master-policy-key
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: master-policy-key
          secret:
            secretName: soc-runtime
            items:
              - key: MASTER_POLICY_PUBKEY
                path: master_policy.pub
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
