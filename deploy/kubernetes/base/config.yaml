apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-config
data:
  INGEST_MODE: queue
  EMBEDDED_WORKERS: "false"
  EMBEDDED_CONNECTORS: "false"
  ELASTICSEARCH_URL: https://elasticsearch.example.com
  NEO4J_URI: neo4j+s://neo4j.example.com
  NEO4J_USER: neo4j
  CONNECTORS_CONFIG: /app/infra/config/connectors.json
  LLM_PROVIDER: none
  LLM_MODEL: ""
  LLM_BASE_URL: ""
  LLM_TIMEOUT: "60"
  MASTER_POLICY_AGENT_ENABLED: "false"
  MASTER_CONFIG_VERSION: "0"
  MASTER_CONFIG_POLL_SECONDS: "60"
  POLICY_POLL_SECONDS: "60"
  BACKUP_ENABLED: "true"
  BACKUP_SCHEDULE_MODE: cron
  BACKUP_SCHEDULE_CRON: "0 2 * * *"
  BACKUP_TIMEZONE: Asia/Jakarta
  BACKUP_COMPONENTS: postgres,redis,neo4j
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_REPOSITORY_URI: /backups
  BACKUP_VERIFY_AFTER_RUN: "true"
  BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup-encryption-key
  BACKUP_ES_REPOSITORY: ""
