            - name: MASTER_POLICY_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: MASTER_POLICY_PUBKEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
