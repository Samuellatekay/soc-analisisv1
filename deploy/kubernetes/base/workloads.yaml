apiVersion: v1
kind: ServiceAccount
metadata:
  name: soc
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: soc-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-api
        app.kubernetes.io/part-of: soc-analisis
    spec:
      serviceAccountName: soc
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: soc-api
      containers:
        - name: api
          image: soc-analisis-api:release
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--app-dir", "apps/api", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: soc-config
            - secretRef:
                name: soc-runtime
                optional: true
            - secretRef:
                name: soc-connectors
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: REDIS_URL
            - name: API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: API_TOKENS
                  optional: true
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: INGEST_API_KEY
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: ELASTICSEARCH_API_KEY
                  optional: true
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: NEO4J_PASSWORD
            - name: OPENCTI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: soc-runtime
                  key: OPENCTI_TOKEN
                  optional: true
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: connectors-config
              mountPath: /app/infra/config/connectors.json
              subPath: connectors.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: connectors-config
          configMap:
            name: soc-connectors-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
