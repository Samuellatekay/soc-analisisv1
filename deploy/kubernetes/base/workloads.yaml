---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Jakarta
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: soc-backup
            app.kubernetes.io/part-of: soc-analisis
        spec:
          restartPolicy: OnFailure
          serviceAccountName: soc
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: soc-analisis-api:release
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "services.backup.main", "--once"]
              envFrom:
                - configMapRef:
                    name: soc-config
                - secretRef:
                    name: soc-runtime
                    optional: true
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: soc-runtime
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: soc-runtime
                      key: REDIS_URL
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: soc-runtime
                      key: NEO4J_PASSWORD
                - name: ELASTICSEARCH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: soc-runtime
                      key: ELASTICSEARCH_API_KEY
                      optional: true
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: backup-key
                  mountPath: /run/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: soc-backups
            - name: backup-key
              secret:
                secretName: soc-runtime
                items:
                  - key: BACKUP_ENCRYPTION_KEY
                    path: backup-encryption-key
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
